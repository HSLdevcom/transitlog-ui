name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-cd:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-typescript.yml@234db0afad207e5af97e17e597b9f0933d22b4c0
    with:
      checkAndTestOutsideDocker: true
      checkAndTestInsideDocker: false
    secrets: inherit
